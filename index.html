<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Mon lecteur de musique personnel et privé">
  <title>Sillon</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="clip-layer" id="clip-layer" aria-hidden="true"></div>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/home"><span class="brand-mark" aria-hidden="true"></span>Sillon</a>
      <nav class="side-nav" aria-label="Navigation principale">
        <a href="#/home" data-tab="home" data-icon="home">Accueil</a>
        <a href="#/library" data-tab="library" data-icon="library">Ma bibliothèque</a>
        <a href="#/playlists" data-tab="playlists" data-icon="playlist">Playlists</a>
        <a href="#/favorites" data-tab="favorites" data-icon="heart">Favoris</a>
      </nav>
      <button class="btn primary wide" data-action="import" data-icon="upload">Importer</button>
      <p class="side-note">Tes fichiers restent sur cet appareil.<br><span data-storage></span></p>
    </aside>

    <main class="main" id="main">
      <div class="view" id="view"></div>
    </main>

    <div class="mini" id="mini" hidden>
      <div class="mini-progress" aria-hidden="true"><span id="mini-bar"></span></div>
      <button class="mini-info" data-action="open-player" aria-label="Ouvrir le lecteur">
        <span id="mini-art"></span>
        <span class="meta"><span class="t" id="mini-title"></span><span class="a" id="mini-artist"></span></span>
      </button>
      <div class="mini-center desk">
        <div class="ctrls">
          <button class="ic js-shuffle" data-action="shuffle" aria-label="Lecture aléatoire" data-icon="shuffle"></button>
          <button class="ic" data-action="prev" aria-label="Précédent" data-icon="prev"></button>
          <button class="ic solid js-play" data-action="toggle" aria-label="Lecture"></button>
          <button class="ic" data-action="next" aria-label="Suivant" data-icon="next"></button>
          <button class="ic js-repeat" data-action="repeat" aria-label="Répéter"></button>
        </div>
        <div class="seekbar">
          <span class="time js-cur">0:00</span>
          <input type="range" class="range js-seek" id="mini-seek" min="0" max="1000" value="0" aria-label="Position dans le titre">
          <span class="time js-dur">0:00</span>
        </div>
      </div>
      <div class="mini-right">
        <button class="ic js-fav" data-action="fav-current" aria-label="Favori"></button>
        <button class="ic mob js-play" data-action="toggle" aria-label="Lecture"></button>
        <div class="vol desk">
          <button class="ic js-mute" data-action="mute" aria-label="Couper le son"></button>
          <input type="range" class="range js-vol" id="mini-vol" min="0" max="100" value="100" aria-label="Volume">
        </div>
        <button class="ic desk" data-action="open-player" aria-label="Lecteur plein écran" data-icon="chevron"></button>
      </div>
    </div>

    <nav class="tabbar" aria-label="Navigation principale">
      <a href="#/home" data-tab="home" data-icon="home"><span>Accueil</span></a>
      <a href="#/library" data-tab="library" data-icon="library"><span>Bibliothèque</span></a>
      <a href="#/playlists" data-tab="playlists" data-icon="playlist"><span>Playlists</span></a>
      <a href="#/favorites" data-tab="favorites" data-icon="heart"><span>Favoris</span></a>
    </nav>
  </div>

  <section class="fp" id="fp" aria-hidden="true" aria-label="Lecteur">
    <div class="fp-bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>
    <div class="fp-inner">
      <header class="fp-head">
        <button class="ic" data-action="close-player" aria-label="Réduire le lecteur" data-icon="down"></button>
        <button class="fp-ctx" data-action="goto-context"><small>En lecture depuis</small><b id="fp-ctx"></b></button>
        <button class="ic" data-action="current-menu" aria-label="Plus d'options" data-icon="more"></button>
      </header>
      <div class="fp-body">
        <div class="fp-art" id="fp-art"></div>
        <div class="fp-queue" id="fp-queue" hidden></div>
      </div>
      <div class="fp-meta" id="fp-meta">
        <div class="meta">
          <h2 id="fp-title"></h2>
          <button class="fp-artist" id="fp-artist" data-action="goto-artist"></button>
        </div>
        <button class="ic js-fav" data-action="fav-current" aria-label="Favori"></button>
      </div>
      <div class="fp-seek">
        <input type="range" class="range js-seek" id="fp-seek" min="0" max="1000" value="0" aria-label="Position dans le titre">
        <div class="times"><span class="js-cur">0:00</span><span class="js-dur">0:00</span></div>
      </div>
      <div class="fp-ctrls">
        <button class="ic js-shuffle" data-action="shuffle" aria-label="Lecture aléatoire" data-icon="shuffle"></button>
        <button class="ic mid" data-action="prev" aria-label="Précédent" data-icon="prev"></button>
        <button class="ic big js-play" data-action="toggle" aria-label="Lecture"></button>
        <button class="ic mid" data-action="next" aria-label="Suivant" data-icon="next"></button>
        <button class="ic js-repeat" data-action="repeat" aria-label="Répéter"></button>
      </div>
      <div class="fp-foot">
        <button class="ic" data-action="add-current" aria-label="Ajouter à une playlist" data-icon="list-plus"></button>
        <div class="vol desk">
          <button class="ic js-mute" data-action="mute" aria-label="Couper le son"></button>
          <input type="range" class="range js-vol" id="fp-vol" min="0" max="100" value="100" aria-label="Volume">
        </div>
        <button class="ic" id="fp-qbtn" data-action="queue-toggle" aria-label="File d'attente" data-icon="queue"></button>
      </div>
    </div>
  </section>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="dropzone" id="dropzone" hidden><div>Dépose tes sons et clips ici</div></div>
  <input type="file" id="file-input" accept="audio/*,video/*,.mp3,.wav,.flac,.m4a,.aac,.ogg,.opus,.mp4,.m4v,.mov,.webm" multiple hidden>
  <input type="file" id="folder-input" webkitdirectory multiple hidden>
</body>
</html>
